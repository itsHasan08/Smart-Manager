name: Build & Release Smart Manager APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Prepare Environment
        run: |
          # If keystore is missing for any reason, restore from base64
          if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          touch .env
          chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Manager-Lite-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v2.0-lite
          name: Smart Manager Lite v2.0
          draft: false
          prerelease: false
          body: |
            ## Smart Manager Lite v2.0
            
            ✅ **Features**:
            - Separated Cash Ledger (নগদ জমা) & Member Management (সদস্যবৃন্দ)
            - Itemized Bazar entries with dynamic quantity and automatic total price calculation
            - Full-sized Red & White App Launcher Icon
            - Clear Status Bar (Battery, Clock & Network always visible without background obstruction)
            - English startup animation text ("Smart Manager")
            - Offline-first Room Database architecture
            
            📥 **Download**: Download the attached `app-debug.apk` below and install on Android.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
