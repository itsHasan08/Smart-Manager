name: Build & Release Smart Manager APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Manager-Lite-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.0
          name: Smart Manager Lite v2.0
          draft: false
          prerelease: false
          body: |
            ## Smart Manager Lite (v2.0)
            
            ✅ **Features**:
            - Separated Cash Ledger & Member Management
            - Dynamic Itemized Bazar with auto price calculation
            - Full Screen Red & White App Icon
            - Clear Status Bar (Battery, Clock & WiFi visibility)
            - 100% Bilingual support (Bangla & English)
            
            📥 **Download**: Download the attached `.apk` file below and install on Android.
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
